# TCP-прокси до брокера.
# log /dev/log нет: в официальном образе нет сокета syslog, с этой строкой процесс падает.
# daemon не ставлю: контейнер должен держать процесс на переднем плане.

global
    maxconn 256

defaults
    mode tcp
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend kafka_frontend
    mode tcp
    bind *:9093
    default_backend kafka_backend

backend kafka_backend
    mode tcp
    balance roundrobin
    server kafka1 kafka:9092 check
    # server kafka2 broker2:9092 check
