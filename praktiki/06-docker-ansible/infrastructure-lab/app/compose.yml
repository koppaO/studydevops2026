services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 5
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
