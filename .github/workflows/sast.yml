name: sast

on:
  push:
  pull_request:

jobs:
  bandit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laboratornye/02-sast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit==1.7.10"

      - name: Run Bandit
        run: bandit -r app -c .bandit -ll
