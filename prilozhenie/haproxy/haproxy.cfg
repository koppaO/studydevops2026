# TCP до kafka:9092.
# log /dev/log нет: в образе нет сокета syslog.
# daemon нет: процесс должен остаться на переднем плане.

global
    maxconn 256

defaults
    mode tcp
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend kafka_frontend
    mode tcp
    bind *:9093
    default_backend kafka_backend

backend kafka_backend
    mode tcp
    balance roundrobin
    server kafka kafka:9092 check
